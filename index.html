    <title>Sanatan Path</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'brand-saffron': '#FF9933',
              'brand-saffron-dark': '#D97706',
              'brand-marigold': '#FBBF24',
              'brand-gold': '#FCD34D',
              'brand-parchment': '#FFFBEB',
              'brand-warm-brown': '#422006',
              'brand-deep-blue': '#0B192F',
              'brand-deep-blue-light': '#172A46',
            },
            fontFamily: {
              'serif': ['Lora', 'Georgia', 'serif'],
              'sans': ['Inter', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out forwards',
              'slide-down': 'slideDown 0.4s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: 0 },
                '100%': { opacity: 1 },
              },
              slideDown: {
                '0%': { opacity: 0, transform: 'translateY(-20px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              },
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
